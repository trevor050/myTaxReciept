name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated budget data is up to date
        run: npm run build:data && git diff --exit-code src/data/budget.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
